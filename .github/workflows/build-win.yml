# Windows 실행 파일(SessionOrchestrator.exe) 빌드. 버전 태그(vX.Y.Z)를 push 하거나 손으로 돌리면
# PyInstaller 로 exe 하나를 만들어 작업 결과물(artifact)로 올린다. 릴리스 등록은 받아서 시험한 뒤 손으로 한다.
# tkinter 는 넣지 않는다 — 넣으면 실행마다 파일 900여 개를 더 풀어 보안 프로그램(백신) 검사로 한 번에 40초가 걸렸다.
name: build-win

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller 설치
        run: python -m pip install --upgrade pip pyinstaller==6.11.1
      - name: 버전 확인 · 버전 정보 파일
        shell: pwsh
        run: |
          # so_app.py 의 VERSION 과 태그가 같아야 한다(자동 업데이트가 이 값으로 비교한다)
          $code = (Select-String -Path scripts/so_app.py -Pattern '^VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $code }
          if ($code -ne $tag) { throw "so_app.py VERSION($code) 과 태그($tag) 가 다릅니다" }
          $n = ($code.Split('.') + @('0', '0', '0'))[0..2] -join ', '
          # exe 속성의 「파일 설명」 — Windows 알림 · 작업 관리자 · PC 보호 창에 보이는 이름
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($n, 0), prodvers=($n, 0), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('FileDescription', 'Session Orchestrator'),
                StringStruct('FileVersion', '$code'),
                StringStruct('InternalName', 'SessionOrchestrator'),
                StringStruct('OriginalFilename', 'SessionOrchestrator.exe'),
                StringStruct('ProductName', 'Session Orchestrator'),
                StringStruct('ProductVersion', '$code')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@ | Set-Content -Encoding utf8 version_info.txt
          Get-Content version_info.txt
      - name: exe 빌드
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SessionOrchestrator
          --exclude-module tkinter --exclude-module _tkinter
          --icon scripts/board-logo.ico
          --version-file version_info.txt
          --add-data "scripts:scripts"
          --add-data "skill:skill"
          scripts/so_app.py
      - name: 버전 출력 확인
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SessionOrchestrator.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput ver.txt
          Get-Content ver.txt
          "exit $($p.ExitCode)"
          $i = Get-Item dist\SessionOrchestrator.exe
          "$($i.Name) $($i.Length) · 파일 설명: $($i.VersionInfo.FileDescription) $($i.VersionInfo.FileVersion)"
          $t = Measure-Command { Start-Process -FilePath dist\SessionOrchestrator.exe -ArgumentList 'queue','list' -Wait -NoNewWindow -RedirectStandardOutput q.txt }
          "queue list: $([math]::Round($t.TotalSeconds,1))s"
          Get-Content q.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SessionOrchestrator-exe
          path: dist/SessionOrchestrator.exe
          retention-days: 7
